name: Daily flight price check

on:
  schedule:
    # 14:00 UTC = 7:00 AM Pacific (PDT). GitHub cron is always UTC.
    - cron: "0 14 * * *"
  workflow_dispatch: {}   # allow manual runs from the Actions tab

permissions:
  contents: write   # commit updated price_history.json
  issues: write     # post the daily report as an issue comment

concurrency:
  group: flight-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run price check
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
        run: python tracker.py

      - name: Commit updated price history
        run: |
          git config user.name  "flight-tracker-bot"
          git config user.email "actions@github.com"
          git add price_history.json report.md
          if git diff --cached --quiet; then
            echo "No history changes to commit."
          else
            git commit -m "Flight prices: $(date -u +%Y-%m-%d)"
            git push
          fi

      - name: Post report to tracking issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TITLE="✈️ Flight price tracker — SEA → SMF / SFO"
          # Reuse the open tracking issue if it exists, otherwise open one.
          NUM=$(gh issue list --state open --search "$TITLE in:title" \
                  --json number,title \
                  --jq ".[] | select(.title==\"$TITLE\") | .number" | head -n1)
          if [ -z "$NUM" ]; then
            NUM=$(gh issue create --title "$TITLE" \
                    --body "Automated daily flight price reports land here as comments." \
                    | grep -oE '[0-9]+$')
          fi
          gh issue comment "$NUM" --body-file report.md
